models:
  qwen:
    type: huggingface
    name: "Qwen/Qwen2-7B-Instruct"
    device: cuda
    max_tokens: 16384        # Per-chunk generation limit
    context_window: 32000  # 32k context
    temperature_range: [0.9, 1.1]
    
  mistral:
    type: huggingface
    name: "mistralai/Mistral-7B-Instruct-v0.3"
    device: cuda
    max_tokens: 16384        # Per-chunk generation limit
    context_window: 32000  # 32k context
    temperature_range: [1.1, 1.35]
    
  llama:
    type: huggingface
    name: "meta-llama/Llama-3.1-8B-Instruct"
    device: cuda
    max_tokens: 2048
    context_window: 8192   # 8k context (conservative)
    temperature_range: [1.0, 1.3]
    
  phi:
    type: huggingface
    name: "microsoft/Phi-3-medium-4k-instruct"
    device: cuda
    max_tokens: 4096  # Increased to better utilize 12GB VRAM
    context_window: 4096   # 4k context
    temperature_range: [0.9, 1.1]

  qwen_small:
    type: huggingface
    name: "Qwen/Qwen2-1.5B-Instruct"
    device: cuda  # Now supported with PyTorch 2.7.1+cu128
    max_tokens: 4096  # Reduced - better quality, lower memory
    context_window: 32768  # 32k context!
    temperature_range: [0.9, 1.1]

  qwen25_small:
    type: huggingface
    name: "Qwen/Qwen2.5-3B-Instruct"
    device: cuda
    max_tokens: 4096  # Testing higher limit
    context_window: 32768  # 32k context
    temperature_range: [1.0, 1.3]  # Higher temp for creative writing

  tinyllama:
    type: huggingface
    name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    device: cuda
    max_tokens: 2048  # Small to minimize VRAM
    context_window: 2048  # 2k context
    temperature_range: [1.0, 1.2]

  llama3_70b:
    type: huggingface
    name: "meta-llama/Meta-Llama-3.1-70B-Instruct"
    device: cuda
    quantization: "4bit"
    max_tokens: 4096
    context_window: 8192
    temperature_range: [0.7, 1.0]

  qwen25_72b:
    type: huggingface
    name: "Qwen/Qwen2.5-72B-Instruct"
    device: cuda
    quantization: "4bit"
    max_tokens: 32768
    context_window: 131072
    temperature_range: [0.8, 1.1]


