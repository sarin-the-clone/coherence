[tool.poetry]
name = "coherence"
version = "0.1.0"
description = "Text generation and coherence metrics analysis"
authors = ["sarin-the-clone"]
readme = "README.md"
repository = "https://github.com/sarin-the-clone/coherence"
# The repository is a collection of scripts, rather than an importable package.
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
transformers = "^4.35.0"
scipy = "^1.11.0"
numba = "^0.60.0"
numpy = "^1.24.0"
pyyaml = "^6.0"
tqdm = "^4.66.0"
ebooklib = "^0.18"
reportlab = "^4.0.0"
accelerate = "^1.0.0"
nvitop = "^1.6.2"
bpytop = "^1.0.68"
tiktoken = "^0.12.0"
natsort = "^8.4.0"
torch = {version = "2.7.1", source = "pytorch"}
sentencepiece = "^0.2.1"
protobuf = "^6.33.5"
pandas = "^2.2.0"
matplotlib = "^3.8.0"
scikit-learn = "^1.4.0"
adjusttext = "^1.3.0"
seaborn = "^0.13.2"
requests = "^2.31.0"

# Optional ingestion/export utilities; not needed for descriptor analysis.
[tool.poetry.group.ebooks]
optional = true

[tool.poetry.group.ebooks.dependencies]
beautifulsoup4 = "^4.12.0"
lxml = ">=4.9,<7"
mobi = "^0.3.3"
gtts = "^2.5.0"
edge-tts = "^7.0.0"

# The spaCy tokenizer also needs a separately installed language model.
[tool.poetry.group.nlp]
optional = true

[tool.poetry.group.nlp.dependencies]
# Keep this optional backend compatible with the locked NumPy 1.x stack.
spacy = "~3.7.0"

[tool.poetry.group.dev.dependencies]
pywavelets = "^1.4.0"


[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
